# =============================================================================
# نام ورک‌فلو (در تب Actions گیت‌هاب نمایش داده می‌شود)
# =============================================================================
name: ATF Tasks Runner

on:
  # =========================================================================
  # روش ۱: اجرای خودکار داخلی گیت‌هاب (پیشنهاد نمی‌شود به دلیل تاخیر سرورها)
  # =========================================================================
  # schedule:
  #   - cron: '*/10 * * * *'

  # =========================================================================
  # روش ۲: اجرای دستی یا تحریک از بیرون توسط سایت cron-job.org
  # =========================================================================
  workflow_dispatch:

# =============================================================================
# قفل هم‌زمانی: جلوگیری از اجرای هم‌پوشان تسک‌ها
# اگر ریپازیتوری دیگری برای تسک‌ها ساختید، نام group را یکتا نگه دارید (مثلاً tasks-runner-g2)
# =============================================================================
concurrency:
  group: tasks-runner-single
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot runner
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        # =====================================================================
        # نام فایل پایتون اجرایی تسک‌ها
        # =====================================================================
        run: python bot_runner_tasks.py
